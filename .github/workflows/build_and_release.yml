name: Multi-Platform Build & Release

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'windows/**'
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  # JOB 0: Calculate Version
  # -----------------------------------------------------------------
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tagger.outputs.tag }}
      is_prerelease: ${{ steps.tagger.outputs.is_prerelease }}
      build_name: ${{ steps.tagger.outputs.build_name }}
      build_number: ${{ steps.tagger.outputs.build_number }}
      build_args: ${{ steps.tagger.outputs.build_args }}
    steps:
      - name: Generate Tag and Name
        id: tagger
        run: |
          # Version = date + run number, e.g. v2026.10.11.42. It increases
          # with every build, so the in-app updater can compare versions
          # and Android accepts the APK as an upgrade (versionCode = run).
          DATE=$(date +'%Y.%-m.%-d')
          RUN=${{ github.run_number }}
          SHA_SHORT=$(echo $GITHUB_SHA | cut -c1-7)
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            TAG="v${DATE}.${RUN}-dev-${SHA_SHORT}"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            TAG="v${DATE}.${RUN}"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_name=${DATE}" >> $GITHUB_OUTPUT
          echo "build_number=${RUN}" >> $GITHUB_OUTPUT
          echo "build_args=--build-name=${DATE} --build-number=${RUN} --dart-define=APP_VERSION=${TAG}" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------
  # JOB 1: Build Android
  # -----------------------------------------------------------------
  build-android:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Download Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      
      - name: Build Android Universal APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter pub get
          # Surface build errors as annotations (job logs need repo access)
          flutter build apk --release ${{ needs.get-version.outputs.build_args }} 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -iE "error|failed|What went wrong" -A3 build.log | head -40 | sed 's/^/::error::/'
            exit "$status"
          fi
        
      - name: Rename Artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk FitGirl-Downloader-${{ needs.get-version.outputs.version }}-android-universal.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: FitGirl-Downloader-*.apk

  # -----------------------------------------------------------------
  # JOB 2: Build Linux
  # -----------------------------------------------------------------
  build-linux:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build Linux
        run: flutter pub get && flutter build linux --release ${{ needs.get-version.outputs.build_args }}

      - name: Compress Build
        run: |
          tar -czvf FitGirl-Downloader-${{ needs.get-version.outputs.version }}-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: FitGirl-Downloader-*.tar.gz

  # -----------------------------------------------------------------
  # JOB 3: Build Windows
  # -----------------------------------------------------------------
  build-windows:
    needs: get-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Build Windows
        shell: bash
        run: |
          flutter pub get
          # Surface compiler errors as annotations (job logs need repo access)
          flutter build windows --release ${{ needs.get-version.outputs.build_args }} 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -iE "error|failed" build.log | head -25 | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Create Installer (Inno Setup)
        run: |
          choco install innosetup
          iscc /DMyAppVersion=${{ needs.get-version.outputs.build_name }}.${{ needs.get-version.outputs.build_number }} windows/installer.iss
          
      - name: Rename Installer
        run: mv build/windows/x64/installer/fitgirl_setup.exe FitGirl-Downloader-${{ needs.get-version.outputs.version }}-windows-setup.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: FitGirl-Downloader-*.exe

  # -----------------------------------------------------------------
  # JOB 4: Build macOS & iOS
  # -----------------------------------------------------------------
  build-apple:
    needs: get-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release ${{ needs.get-version.outputs.build_args }}

      - name: Compress macOS Build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../FitGirl-Downloader-${{ needs.get-version.outputs.version }}-macos-universal.zip .
      
      - name: Build iOS
        run: flutter build ios --release --no-codesign ${{ needs.get-version.outputs.build_args }}

      - name: Compress iOS Build
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../../../FitGirl-Downloader-${{ needs.get-version.outputs.version }}-ios-unsigned.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-builds
          path: FitGirl-Downloader-*

  # -----------------------------------------------------------------
  # JOB 5: Create Release
  # -----------------------------------------------------------------
  create-release:
    needs: [get-version, build-android, build-linux, build-windows, build-apple]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage Files
        run: |
          mkdir release_files
          find artifacts/ -type f \( -name "FitGirl-Downloader-*" \) -exec mv {} release_files/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          prerelease: ${{ needs.get-version.outputs.is_prerelease }}
          files: release_files/*
          generate_release_notes: true
        env:
          TOKEN: ${{ secrets.TOKEN }}
